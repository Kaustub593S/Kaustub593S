sharray="3 4"/><line x1="672" y1="104" x2="672" y2="150" stroke="#243049" stroke-dasharray="3 4"/><line x1="820" y1="104" x2="820" y2="150" stroke="#243049" stroke-dasharray="3 4"/><line x1="80" y1="150" x2="820" y2="150" stroke="#243049" stroke-width="2"/><rect x="18" y="44" width="124" height="60" rx="8" fill="#0b1424" stroke="#243049" stroke-width="1.5" style="animation:k2 18.0s linear infinite"/><text x="80" y="70" text-anchor="middle" font-size="14" font-weight="700" fill="#E6EDF3">Client</text><text x="80" y="90" text-anchor="middle" font-size="11" fill="#7d8aa0">curl / browser</text><rect x="166" y="44" width="124" height="60" rx="8" fill="#0b1424" stroke="#243049" stroke-width="1.5" style="animation:k3 18.0s linear infinite"/><text x="228" y="70" text-anchor="middle" font-size="14" font-weight="700" fill="#E6EDF3">Filter chain</text><text x="228" y="90" text-anchor="middle" font-size="11" fill="#7d8aa0">JWT · RBAC · limit</text><rect x="314" y="44" width="124" height="60" rx="8" fill="#0b1424" stroke="#243049" stroke-width="1.5" style="animation:k4 18.0s linear infinite"/><text x="376" y="70" text-anchor="middle" font-size="14" font-weight="700" fill="#E6EDF3">Controller</text><text x="376" y="90" text-anchor="middle" font-size="11" fill="#7d8aa0">@RestController</text><rect x="462" y="44" width="124" height="60" rx="8" fill="#0b1424" stroke="#243049" stroke-width="1.5" style="animation:k5 18.0s linear infinite"/><text x="524" y="70" text-anchor="middle" font-size="14" font-weight="700" fill="#E6EDF3">Service</text><text x="524" y="90" text-anchor="middle" font-size="11" fill="#7d8aa0">business logic</text><rect x="610" y="44" width="124" height="60" rx="8" fill="#0b1424" stroke="#243049" stroke-width="1.5" style="animation:k6 18.0s linear infinite"/><text x="672" y="70" text-anchor="middle" font-size="14" font-weight="700" fill="#E6EDF3">Repository</text><text x="672" y="90" text-anchor="middle" font-size="11" fill="#7d8aa0">Spring Data JPA</text><rect x="7